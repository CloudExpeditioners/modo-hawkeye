name: Hawkeye · Diagnóstico de drift
run-name: "Hawkeye diagnose · ${{ inputs.correlation_id }}"

# Lo invoca el agente (Copilot Studio → agent flow → API de GitHub).
# NUNCA modifica Azure: usa una identidad de solo lectura y `terraform plan -lock=false`.

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "ID de correlación generado por el agente (ej. diag-20261017-103000-ab12cd34)"
        required: true
        type: string
      requested_by:
        description: "Quién solicita el diagnóstico"
        required: false
        default: "manual"
        type: string
      reason:
        description: "Motivo de la solicitud"
        required: false
        default: "Diagnóstico solicitado manualmente"
        type: string
      lookback_hours:
        description: "Horas hacia atrás para buscar evidencia en Activity Log"
        required: false
        default: "6"
        type: string

permissions:
  contents: write   # publicar resultado en la rama hawkeye-results
  issues: write     # abrir incidente cuando hay drift
  id-token: write   # OIDC con Azure

env:
  TF_VERSION: "1.9.8"
  RESOURCE_GROUP: rg-modo-hawkeye-demo
  WORKSPACE_NAME: law-modo-hawkeye-demo
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_READER_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  CORRELATION_ID: ${{ inputs.correlation_id }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  REASON: ${{ inputs.reason }}
  LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnose:
    name: Diagnóstico (identidad de solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validar entradas
        id: validate
        run: |
          [[ "$CORRELATION_ID" =~ ^[A-Za-z0-9-]{6,64}$ ]] || { echo "::error::correlation_id inválido"; exit 1; }
          [[ "$LOOKBACK_HOURS" =~ ^[0-9]{1,3}$ ]] || { echo "::error::lookback_hours inválido"; exit 1; }
          mkdir -p out
          date -u +%Y-%m-%dT%H:%M:%SZ > out/started_at.txt

      - name: Azure login (OIDC · gha-modo-hawkeye-reader)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_READER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false -no-color

      - name: Terraform plan (sin aplicar, sin bloquear el estado)
        id: plan
        working-directory: infra
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan > ../out/plan.txt 2>&1
          code=$?
          set -e
          cat ../out/plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 1 ]; then
            terraform show -json tfplan > ../out/plan.json
          fi

      - name: Resumir plan (seguro para repo público)
        if: steps.plan.outputs.exitcode != '1'
        run: scripts/summarize-plan.sh out/plan.json out

      - name: Recolectar evidencia (Azure Monitor / Activity Log)
        id: evidence
        run: |
          src=$(scripts/collect-evidence.sh "$RESOURCE_GROUP" "$WORKSPACE_NAME" "$LOOKBACK_HOURS" out/evidence.json)
          echo "source=$src" >> "$GITHUB_OUTPUT"
          jq -r -f scripts/render-evidence.jq out/evidence.json > out/evidence.md

      - name: Abrir incidente si hay drift
        id: issue
        if: steps.plan.outputs.exitcode == '2'
        run: |
          gh label create hawkeye --color 7B2FF7 --description "Modo Hawkeye" 2>/dev/null || true
          gh label create drift   --color D93F0B --description "Configuration drift" 2>/dev/null || true
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## 🎯 Drift detectado por Modo Hawkeye"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Diagnóstico | \`$CORRELATION_ID\` |"
            echo "| Solicitado por | $REQUESTED_BY |"
            echo "| Motivo | $REASON |"
            echo "| Ejecución | $RUN_URL |"
            echo "| Huella del plan | \`$(cut -c1-16 out/fingerprint.txt)\` |"
            echo
            echo "### Diferencias (Azure vs Terraform)"
            cat out/changes.md
            echo
            echo "### Evidencia: ¿quién hizo el cambio?"
            cat out/evidence.md
            echo
            echo "> La corrección requiere aprobación humana y se ejecuta con una identidad distinta, solo dentro del environment \`hawkeye-remediation\`."
          } > out/issue.md
          url=$(gh issue create --title "[Hawkeye] Drift detectado · $CORRELATION_ID" --body-file out/issue.md --label hawkeye --label drift)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Construir resultado para el agente
        id: result
        if: always() && steps.validate.outcome == 'success'
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          EVIDENCE_SOURCE: ${{ steps.evidence.outputs.source }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          mkdir -p out
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [ -f out/changes.json ]  || echo '[]' > out/changes.json
          [ -f out/changes.md ]    || echo "No se pudo calcular el plan." > out/changes.md
          [ -f out/evidence.json ] || echo '[]' > out/evidence.json
          [ -f out/evidence.md ]   || echo "_Sin evidencia._" > out/evidence.md
          [ -f out/fingerprint.txt ] || echo "" > out/fingerprint.txt

          case "${PLAN_EXIT:-}" in
            0) STATUS=completed; DRIFT=false; TEXT="Sin drift: Azure coincide con Terraform." ;;
            2) STATUS=completed; DRIFT=true;  TEXT="Drift detectado: $(jq 'length' out/changes.json) recurso(s) difieren de lo declarado en Terraform." ;;
            *) STATUS=error;     DRIFT=false; TEXT="El diagnóstico falló antes de terminar. Revisa la ejecución en GitHub Actions." ;;
          esac

          jq -n \
            --arg kind diagnosis --arg id "$CORRELATION_ID" --arg status "$STATUS" \
            --argjson drift "$DRIFT" --arg summary "$TEXT" \
            --arg changes_md "$(cat out/changes.md)" --arg evidence_md "$(cat out/evidence.md)" \
            --slurpfile changes out/changes.json --slurpfile evidence out/evidence.json \
            --arg fingerprint "$(cat out/fingerprint.txt)" \
            --arg evidence_source "${EVIDENCE_SOURCE:-none}" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_url "$RUN_URL" \
            --arg issue_url "${ISSUE_URL:-}" --arg issue_number "${ISSUE_NUMBER:-}" \
            --arg requested_by "$REQUESTED_BY" --arg reason "$REASON" \
            --arg identity "gha-modo-hawkeye-reader (solo lectura)" \
            --arg started_at "$(cat out/started_at.txt 2>/dev/null || true)" \
            --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{kind:$kind, id:$id, status:$status, drift:$drift, summary:$summary,
              change_count:($changes[0]|length), changes:$changes[0], changes_md:$changes_md,
              evidence:$evidence[0], evidence_md:$evidence_md, evidence_source:$evidence_source,
              fingerprint:$fingerprint, run_id:$run_id, run_url:$run_url,
              issue_url:$issue_url, issue_number:$issue_number,
              requested_by:$requested_by, reason:$reason, identity:$identity,
              started_at:$started_at, finished_at:$finished_at}' > out/result.json
          cat out/result.json

      - name: Publicar resultado (rama hawkeye-results)
        if: always() && steps.validate.outcome == 'success'
        run: scripts/publish-result.sh out/result.json "results/diagnosis/${CORRELATION_ID}.json"

      - name: Job summary
        if: always() && steps.validate.outcome == 'success'
        run: |
          r=out/result.json
          if [ "$(jq -r .drift $r)" = "true" ]; then BADGE="🔴 **DRIFT DETECTADO**"; elif [ "$(jq -r .status $r)" = "error" ]; then BADGE="⚠️ **ERROR**"; else BADGE="🟢 **SIN DRIFT**"; fi
          {
            echo "# 🎯 Modo Hawkeye · Diagnóstico"
            echo
            echo "$BADGE — $(jq -r .summary $r)"
            echo
            echo '```mermaid'
            echo 'flowchart LR'
            echo '  A["🤖 Agente<br/>Copilot Studio"] -->|tool call| B["⚡ Agent flow"]'
            echo '  B -->|workflow_dispatch| C["🐙 GitHub Actions"]'
            echo '  C -->|OIDC · solo lectura| D["🏗️ terraform plan"]'
            echo '  C -->|KQL| E["📊 Azure Monitor"]'
            echo '  D --> F["📄 Resultado + huella"]'
            echo '  E --> F'
            echo '  F -->|respuesta| A'
            echo '```'
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Diagnóstico | \`$(jq -r .id $r)\` |"
            echo "| Solicitado por | $(jq -r .requested_by $r) |"
            echo "| Identidad | $(jq -r .identity $r) |"
            echo "| Huella | \`$(jq -r '.fingerprint[0:16]' $r)\` |"
            echo "| Evidencia | $(jq -r .evidence_source $r) |"
            echo "| Incidente | $(jq -r '.issue_url // "-"' $r) |"
            echo
            echo "## Diferencias"
            jq -r .changes_md $r
            echo
            echo "## ¿Quién hizo el cambio?"
            jq -r .evidence_md $r
          } >> "$GITHUB_STEP_SUMMARY"
